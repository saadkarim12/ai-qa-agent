[project]
name = "ai-qa-agent"
version = "0.1.0"
description = "AI QA Agent — Software Quality as a Service — Layer 1: Requirements Intelligence"
requires-python = ">=3.12"
dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",       # File uploads

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",               # Async PostgreSQL driver
    "alembic>=1.13.0",               # Migrations
    "greenlet>=3.0.0",               # Required by SQLAlchemy async

    # --- Document Parsing (Rule-Based) ---
    "pdfplumber>=0.11.0",            # PDF text + table extraction
    "python-docx>=1.1.0",           # DOCX parsing
    "openpyxl>=3.1.0",              # XLSX parsing
    "markdown-it-py>=3.0.0",        # Markdown parsing
    "python-magic>=0.4.27",         # File type detection

    # --- LLM (Model Gateway) ---
    "anthropic>=0.34.0",            # Claude SDK
    "pydantic>=2.8.0",              # Schema validation on LLM output

    # --- Workflow Orchestration ---
    "temporalio>=1.7.0",            # Temporal SDK

    # --- Cloud / Storage ---
    "azure-storage-blob>=12.22.0",  # Azure Blob Storage
    "azure-identity>=1.17.0",       # Azure auth

    # --- Utilities ---
    "redis>=5.0.0",                 # Cache, coordination
    "httpx>=0.27.0",                # HTTP client (Jira, external calls)
    "structlog>=24.0.0",            # Structured logging
    "python-jose[cryptography]>=3.3.0",  # JWT validation
    "tenacity>=8.0.0",              # Retry logic
    "uuid7>=0.1.0",                 # UUIDv7 (time-sortable)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",                # For TestClient
    "ruff>=0.6.0",                  # Linting + formatting
    "mypy>=1.11.0",                 # Type checking
    "sqlalchemy[mypy]>=2.0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
